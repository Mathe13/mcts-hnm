title: "MCTS-HNM: Monte Carlo Tree Search for Hierarchical Hard Negative Mining in Class-Imbalanced Learning"

authors:
  - name: "Matheus Santos"
    affiliation: "PPGC - Universidade Federal do Rio Grande do Sul (UFRGS)"
